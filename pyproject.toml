# Maturin build config for the `sccp` wheel. The version is single-sourced from
# Cargo.toml (`dynamic = ["version"]`), so PyPI and crates.io always ship the same
# number. `extension-module` is the ONLY place that feature is enabled — never by
# `cargo test`/`cargo clippy` (it un-links libpython and breaks Rust test binaries).
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sccp"
description = "Rust-backed SCCP (ITU-T Q.711-Q.716) connectionless codec for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Real Time Telecom B.V." }]
keywords = ["sccp", "ss7", "sigtran", "tcap", "telecom"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Communications",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Real-Time-Telecom-B-V/sccp"
Repository = "https://github.com/Real-Time-Telecom-B-V/sccp"

[tool.maturin]
# Mixed layout: compiled ext at `sccp._sccp`, pure-Python shim under python/.
module-name = "sccp._sccp"
python-source = "python"
features = ["extension-module"]
